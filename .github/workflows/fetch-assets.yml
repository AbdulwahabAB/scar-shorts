name: Fetch game images

on:
  push:
    paths:
      - "episodes/*.json"
      - "tools/fetch_images.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch Steam images for episodes missing assets
        run: |
          for f in episodes/*.json; do
            slug=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['slug'])" "$f")
            if [ ! -f "assets/$slug/manifest.json" ] || [ "$f" -nt "assets/$slug/manifest.json" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              python3 tools/fetch_images.py "$f"
            fi
          done
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Fetch game images" && git pull --rebase origin main && git push)
